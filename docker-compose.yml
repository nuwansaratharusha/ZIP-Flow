services:
  postgres:
    image: postgres:16-alpine
    container_name: zipflow-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-zipflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ChangeThisLocalPassword!1}"
      POSTGRES_DB: "${POSTGRES_DB:-ZipFlow}"
    volumes:
      - zipflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zipflow} -d ${POSTGRES_DB:-ZipFlow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: backend/ZipFlow.Api
      dockerfile: Dockerfile
    container_name: zipflow-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Development keeps HTTPS-redirect off (we terminate at nginx over HTTP)
      # and enables the FoundationSeeder admin bootstrap + Swagger.
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ZipFlow};Username=${POSTGRES_USER:-zipflow};Password=${POSTGRES_PASSWORD:-ChangeThisLocalPassword!1}"
      Jwt__Issuer: "ZipFlow"
      Jwt__Audience: "ZipFlow.Clients"
      Jwt__SigningKey: "${JWT_SIGNING_KEY}"
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "30"
      Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN}"
      # Seed the first admin + demo waiter on empty database.
      BootstrapAdmin__Enabled: "true"
      BootstrapAdmin__Email: "${ADMIN_EMAIL:-admin@zipflow.local}"
      BootstrapAdmin__Password: "${ADMIN_PASSWORD:-ChangeMe123!}"
      BootstrapAdmin__WaiterPassword: "${ADMIN_PASSWORD:-ChangeMe123!}"
      # Epson Server Direct Print: secret token the printer includes in its poll URL.
      ServerDirectPrint__Token: "${SDP_TOKEN}"
      # Gemini (menu photo OCR import). Leave key blank to disable the feature.
      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
      Gemini__Model: "${GEMINI_MODEL:-gemini-3.7-flash}"
    expose:
      - "8080"
    restart: unless-stopped

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: zipflow-web
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  zipflow_pg_data:

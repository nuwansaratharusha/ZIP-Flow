    <!-- Polyfill crypto.randomUUID for non-secure (HTTP) contexts. The app calls
         crypto.randomUUID() when opening tables / sending rounds; that API is only
         exposed over HTTPS or localhost. getRandomValues IS available on HTTP, so
         we shim randomUUID with it. Remove once the site is served over HTTPS. -->
    <script>
      (function () {
        if (typeof crypto !== 'undefined' && typeof crypto.randomUUID !== 'function' && crypto.getRandomValues) {
          crypto.randomUUID = function () {
            return ('10000000-1000-4000-8000-100000000000').replace(/[018]/g, function (c) {
              return (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16);
            });
          };
        }
      })();
    </script>
